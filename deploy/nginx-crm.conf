# Host nginx vhost for a server that already runs nginx on 80/443 (e.g. the
# production server). The CRM stack listens on 127.0.0.1:${HTTP_PORT}
# (8090 on the production server).
#
#   sudo cp deploy/nginx-crm.conf /etc/nginx/sites-available/crm.conf
#   sudo ln -s /etc/nginx/sites-available/crm.conf /etc/nginx/sites-enabled/crm.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d salescrm.newral.in
#
# certbot adds the 443 server block and the HTTP→HTTPS redirect itself.

map $http_upgrade $crm_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name salescrm.newral.in;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # Frappe picks the site from this header.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $crm_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
